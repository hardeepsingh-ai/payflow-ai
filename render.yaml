services:
  - type: web
    name: payflow-ai
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_DEMO
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"
